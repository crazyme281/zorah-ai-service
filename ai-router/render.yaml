services:
  - type: web
    name: lite-ai-router-backend
    runtime: python
    rootDir: backend
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # Provider keys - set these values in the Render dashboard
      # (Environment tab) rather than committing them here.
      - key: CLAUDE_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ZAI_API_KEY
        sync: false
      - key: COHERE_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      # Server-side only — subscriptions/quota (Supabase service role)
      # and payment verification (Flutterwave secret key).
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: FLUTTERWAVE_SECRET_KEY
        sync: false
      # Comma-separated frontend origin(s) allowed to call this API.
      - key: ALLOWED_ORIGINS
        value: "*"