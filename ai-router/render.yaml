services:
  - type: web
    name: lite-ai-router-backend
    runtime: python
    rootDir: backend
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # Provider keys - set these values in the Render dashboard
      # (Environment tab) rather than committing them here.
      - key: TOGETHER_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ZAI_API_KEY
        sync: false
      - key: COHERE_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      # Comma-separated frontend origin(s) allowed to call this API.
      # Tighten this once the frontend has a real deployed URL.
      - key: ALLOWED_ORIGINS
        value: "*"
